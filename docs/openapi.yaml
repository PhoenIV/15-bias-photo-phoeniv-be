openapi: 3.0.3
info:
  title: 최애의 포토 API
  version: 0.1.0
  description: |
    Phoen_iv 팀 노션 「API 명세」를 Swagger 형식으로 옮기고 반영한 문서입니다.

    ## 10/27 확정 사항
    1. **enum 값은 대문자 + 밑줄** — DB와 응답 모두 같은 값 (`SUPER_RARE`, `FAN_SIGN`, `PENDING`). 화면에서만 FE가 밑줄을 빼고 표시
    2. **교환 상태**: `PENDING / APPROVED / REJECTED / CANCELLED`
    3. **판매글의 교환 제시 목록**(`GET /api/sales/{saleId}/exchanges`)은 판매자는 전체, 그 외 사용자는 본인이 보낸 제시만 조회 → 구매자 화면의 「내가 제시한 교환 목록」도 이 API로 처리
    4. **나에게 들어온 교환 제시 전체**(`GET /api/exchanges/me`)는 만들어 두고 필요하면 사용
    5. `/api/auth/me`는 `/api/users/me`와 중복이라 삭제 (총 24개 API)
    6. 판매글 수정 시 수량 변경 허용, 교환 제시 설명은 선택값, 같은 카드로 같은 판매글 재제시 불가

    ## 10/27 회의 결정
    7. **회원가입하면 바로 로그인** (인증 쿠키 설정), 가입 시 **기본 포인트 0**
    8. **판매글 상세는 로그인한 사용자만** 조회 (목록은 비로그인도 가능)
    9. **교환 알림**: 승인·거절되면 제시자에게 알림. 제시자가 제시를 취소할 때 판매자에게는 알림 없음 (필요하면 나중에 추가)
    10. **구매 중 가격이 바뀌면 구매를 막는다** — 방법(`expectedPrice` 비교)은 Sales 담당 검토 후 확정
    11. **페이지네이션**: 마켓플레이스는 **커서 방식 15개로 확정**, 마이갤러리는 페이지 번호 방식 유지 (무한 스크롤로 바꾸면 공유)
    12. **회원 탈퇴는 이번 범위에서 제외** — 필드를 넣었다 빼기가 어려워서 필요할 때 추가
    13. **구글 로그인(OAuth)**은 기본 기능 완료 후 추가 예정 (아직 명세 없음)
    14. **입력값 제한**은 아래 표대로 BE zod 검증에 반영
    15. 이 문서는 **백엔드 서버에서 Swagger UI로 제공** → `http://localhost:5001/api-docs`

    16. **교환과 판매 수량은 별개** — 교환은 판매 등록하지 않은 카드(`netQuantity`)로만 이루어짐.
        예: 10장 보유 중 3장을 판매 등록하면, 교환에 쓸 수 있는 건 남은 7장. 교환을 승인해도 판매글의 남은 수량은 줄지 않음
    17. **판매글을 내릴 때** 자동 취소되는 교환 제시의 제시자에게 **알림을 보내지 않음**
    18. **검색어는 포토카드 이름만** 검색
    19. **정렬 값은 snake_case로 통일** (마이갤러리 방식): `latest`, `oldest`, `price_asc`, `price_desc`

    ## 에러 응답 규칙
    모든 에러는 `{ "error": { "code", "message", "fieldErrors" } }` 형식입니다.

    | 상태 | 언제 | code 예시 |
    | --- | --- | --- |
    | 400 | 요청 값 자체가 잘못됨 (형식, 범위, 필수값) | `VALIDATION_FAILED` (어느 칸이 틀렸는지는 `fieldErrors`) |
    | 401 | 로그인 안 함 / 토큰 만료 | `UNAUTHENTICATED` |
    | 403 | 로그인은 했지만 권한 없음 (남의 것) | `SALE_FORBIDDEN`, `USER_CARD_FORBIDDEN` |
    | 404 | 대상이 없음 | `SALE_NOT_FOUND`, `EXCHANGE_NOT_FOUND` |
    | 409 | 요청은 맞지만 **지금 상태** 때문에 처리 불가 | `SALE_SOLD_OUT`, `POINT_NOT_ENOUGH` |
    | 429 | 시간 제한 | `BOX_COOLDOWN` |
    | 500 | 서버 오류 | `INTERNAL_SERVER_ERROR` |

    - code 이름은 **`대상_상태`** 순서 (`SALE_SOLD_OUT`, `POINT_NOT_ENOUGH`, `CARD_QUANTITY_NOT_ENOUGH`)
    - 취소된 판매글: **조회**(상세)할 때는 없는 것으로 보고 404 `SALE_NOT_FOUND`, **행동**(수정·내리기·구매·교환 제시)할 때는 409 `SALE_CANCELLED`

    ## 입력값 제한
    | 항목 | 제한 |
    | --- | --- |
    | 카드 이름 | 1~30자 |
    | 카드 설명 | 0~100자 |
    | 교환 희망 설명 / 교환 제시 설명 | 0~200자 |
    | 카드 이미지 | jpg · png · webp, 5MB 이하 |
    | 가격 (최소 가격, 판매 가격) | 0~100,000 포인트 |
    | 발행량 / 판매·구매 수량 | 1~10장 |
    | 검색어 | 0~50자 |
    | 한 페이지 개수 | 1~50 (알림은 1~30) |

    **인증**: 로그인(또는 회원가입)하면 `accessToken`(15분), `refreshToken`(7일)이 httpOnly 쿠키로 저장됩니다.
    이 화면이 백엔드와 같은 주소에서 열려 있으면, 로그인 API를 먼저 실행한 뒤 다른 API를 "Try it out"으로 테스트할 수 있습니다.

servers:
  - url: 
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 인증 (임의균)
  - name: Users
    description: 프로필 (-)
  - name: PointDraws
    description: 포인트 뽑기 (-)
  - name: Notifications
    description: 알림 (-)
  - name: Cards
    description: 마이갤러리 · 포토카드 생성 (김수지)
  - name: Sales
    description: 포토카드 판매 (이승현, 박수환)
  - name: Exchanges
    description: 포토카드 교환 (이승현, 박수환)

security:
  - cookieAuth: []

paths:
  # ───────────────────────── Auth ─────────────────────────
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      description: 가입에 성공하면 **바로 로그인 상태**가 됩니다 (`accessToken`, `refreshToken` 쿠키 설정). 기본 포인트는 0입니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, nickname, password, passwordConfirm]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: 서버에서 소문자로 변환 후 저장
                  example: user1@example.com
                nickname:
                  type: string
                  minLength: 2
                  maxLength: 10
                  description: 앞뒤 공백 제거
                  example: 최애덕후
                password:
                  type: string
                  minLength: 8
                  maxLength: 12
                  description: 영문과 숫자를 각각 1자 이상 포함
                  example: password1234
                passwordConfirm:
                  type: string
                  description: password와 동일해야 함 (저장하지 않음)
                  example: password1234
      responses:
        '201':
          description: 가입 성공 (바로 로그인됨)
          headers:
            Set-Cookie:
              description: 'accessToken (15분), refreshToken (7일) — httpOnly, sameSite=lax, path=/'
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/AuthUser' }
              example:
                data:
                  user:
                    {
                      id: 1,
                      email: user1@example.com,
                      nickname: 최애덕후,
                      point: 0,
                    }
        '400':
          description: 필수값 누락, 형식 오류, 비밀번호 불일치
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: VALIDATION_FAILED
                  message: 입력값을 확인해 주세요.
                  fieldErrors:
                    nickname: [2~10자로 입력해 주세요.]
                    passwordConfirm: [비밀번호가 일치하지 않습니다.]
        '409':
          description: 이메일 또는 닉네임 중복 (둘 다 중복이면 이메일 에러 먼저)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                EMAIL_DUPLICATE:
                  summary: 이메일 중복
                  value:
                    error:
                      code: EMAIL_DUPLICATE
                      message: 이미 사용 중인 이메일입니다.
                      fieldErrors: { email: [이미 사용 중인 이메일입니다.] }
                NICKNAME_DUPLICATE:
                  summary: 닉네임 중복
                  value:
                    error:
                      code: NICKNAME_DUPLICATE
                      message: 이미 사용 중인 닉네임입니다.
                      fieldErrors: { nickname: [이미 사용 중인 닉네임입니다.] }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: |
        성공하면 `accessToken`, `refreshToken` 쿠키가 설정됩니다.
        이메일이 없는 경우와 비밀번호가 틀린 경우 같은 메시지를 반환합니다. 구글 가입 회원의 일반 로그인 시도도 401입니다.

        ⚠️ 구글 로그인(OAuth) API는 기본 기능 완료 후 추가 예정 (임의균)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  { type: string, format: email, example: user1@example.com }
                password: { type: string, example: password1234 }
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: 'accessToken (15분), refreshToken (7일) — httpOnly, sameSite=lax, path=/'
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/AuthUser' }
              example:
                data:
                  user:
                    {
                      id: 1,
                      email: user1@example.com,
                      nickname: 최애덕후,
                      point: 1000,
                    }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: 이메일이 없거나 비밀번호가 틀림
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: INVALID_CREDENTIALS,
                    message: 이메일 또는 비밀번호가 올바르지 않습니다.,
                    fieldErrors: {},
                  }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: 인증 쿠키를 삭제합니다.
      responses:
        '204':
          description: 로그아웃 성공 (응답 본문 없음)
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: 토큰 재발급
      description: refreshToken 쿠키로 accessToken을 다시 발급합니다. FE는 401을 받으면 이 API를 호출한 뒤 원래 요청을 다시 보냅니다.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 재발급 성공
          headers:
            Set-Cookie:
              description: 새 accessToken
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/AuthUser' }
        '401':
          description: 쿠키 없음, 만료, 위조, 존재하지 않는 유저
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: UNAUTHENTICATED,
                    message: 다시 로그인해 주세요.,
                    fieldErrors: {},
                  }

  # ───────────────────────── Users ─────────────────────────
  /api/users/me:
    get:
      tags: [Users]
      summary: 내 프로필 조회
      description: 상단 메뉴의 포인트와 프로필 드롭다운에 표시합니다. 포인트가 바뀐 뒤(구매, 뽑기 등) 다시 조회합니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: 회원 번호, example: 7 }
                      nickname: { type: string, example: 포토초보 }
                      point:
                        {
                          type: integer,
                          description: 현재 보유 포인트,
                          example: 105,
                        }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── PointDraws ─────────────────────────
  /api/pointDraws/status:
    get:
      tags: [PointDraws]
      summary: 랜덤박스 참여 가능 여부 조회
      description: |
        마지막 지급 시각부터 60분이 지나면 다시 참여할 수 있습니다. 대기 중이어도 조회 자체는 200입니다.
        화면에서는 로그인 직후와 로그인 상태에서 1분마다 확인합니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      canDraw:
                        {
                          type: boolean,
                          description: 'true: 참여 가능, false: 대기 필요',
                        }
                      nextAvailableAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: 다음 참여 가능 시각. 참여 이력이 없으면 null
                      serverTime:
                        {
                          type: string,
                          format: date-time,
                          description: 남은 시간 계산 기준 서버 시각,
                        }
              example:
                data:
                  canDraw: false
                  nextAvailableAt: '2026-10-22T04:00:00.000Z'
                  serverTime: '2026-10-22T03:01:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/pointDraws:
    post:
      tags: [PointDraws]
      summary: 랜덤박스 뽑기
      description: |
        고른 상자로 뽑기에 참여하고 서버가 정한 포인트를 받습니다. 회원 번호와 지급액은 요청으로 받지 않습니다.
        성공 후 `GET /api/users/me`를 다시 조회해 포인트를 갱신합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selectedBox]
              properties:
                selectedBox:
                  {
                    type: integer,
                    enum: [1, 2, 3],
                    description: 선택한 상자 번호,
                    example: 2,
                  }
      responses:
        '201':
          description: 포인트 지급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      amount:
                        {
                          type: integer,
                          description: 이번에 받은 포인트,
                          example: 5,
                        }
                      nextAvailableAt:
                        {
                          type: string,
                          format: date-time,
                          example: '2026-10-22T04:00:00.000Z',
                        }
        '400':
          description: 상자 번호가 없거나 1~3이 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: VALIDATION_FAILED
                  message: 입력값을 확인해 주세요.
                  fieldErrors:
                    { selectedBox: ['상자 번호는 1, 2, 3 중 하나여야 합니다.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: 대기 시간이 남음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: BOX_COOLDOWN,
                    message: 마지막 뽑기에서 1시간 후 다시 참여할 수 있어요.,
                    fieldErrors: {},
                  }

  # ───────────────────────── Notifications ─────────────────────────
  /api/notifications:
    get:
      tags: [Notifications]
      summary: 알림 목록 조회
      description: |
        본인의 최근 7일 알림을 최신순(같으면 id 큰 순)으로 조회합니다. 조회만으로는 읽음 처리되지 않습니다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 12 }
        - name: unreadOnly
          in: query
          description: 'true: 안 읽은 알림만'
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  unreadCount:
                    type: integer
                    description: 페이지·필터와 관계없이 최근 7일 전체의 안 읽은 알림 수 (배지용)
                  serverTime: { type: string, format: date-time }
              example:
                data:
                  - {
                      id: 42,
                      message: 포토카드 1장이 판매되었습니다.,
                      saleId: 31,
                      createdAt: '2026-10-22T02:59:00.000Z',
                      readAt: null,
                    }
                  - {
                      id: 41,
                      message: 새로운 교환 제안이 도착했습니다.,
                      saleId: 31,
                      createdAt: '2026-10-22T02:58:00.000Z',
                      readAt: '2026-10-22T02:58:30.000Z',
                    }
                pagination:
                  {
                    page: 1,
                    limit: 12,
                    totalCount: 2,
                    totalPages: 1,
                    hasNext: false,
                  }
                unreadCount: 1
                serverTime: '2026-10-22T03:00:00.000Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/readAll:
    post:
      tags: [Notifications]
      summary: 알림 전체 읽음
      description: 알림 목록을 열 때 호출합니다. 새로 읽을 알림이 없어도 204입니다. 이미 읽은 알림의 읽은 시각은 유지됩니다.
      responses:
        '204':
          description: 성공 (응답 본문 없음)
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/stream:
    get:
      tags: [Notifications]
      summary: 실시간 알림 연결 (SSE)
      description: |
        연결을 유지하면서 알림 상태가 바뀌면 신호를 보냅니다. 이벤트의 data는 항상 `{}`이고,
        실제 알림은 `GET /api/notifications`로 다시 조회합니다.

        | 이벤트 | 의미 · 화면 처리 |
        | --- | --- |
        | `ready` | 연결·재연결 완료 → 알림 목록·배지·프로필 갱신 |
        | `changed` | 알림 상태 변경 → 알림 목록·배지·프로필 갱신 |
        | `session-expired` | 연결 후 로그인 만료 → 연결 종료, 로그인 상태 정리 |

        브라우저의 `EventSource`로 연결하면 `Accept: text/event-stream`이 자동으로 붙습니다.
        Swagger의 "Try it out"으로는 스트림이 끝나지 않아 테스트가 어렵습니다.
      responses:
        '200':
          description: 연결 성공 — 이벤트 스트림
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: ready
                data: {}

                event: changed
                data: {}
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── Cards ─────────────────────────
  /api/cards:
    post:
      tags: [Cards]
      summary: 포토카드 생성
      description: |
        포토카드(PhotoCard)를 발행하고, 발행 수량만큼 내 보유 카드(UserCard)를 함께 만듭니다 (한 트랜잭션).
        이번 달 생성 횟수가 3회 미만이어야 합니다. 이미지는 서버가 Cloudinary에 업로드합니다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, grade, genre, minPrice, totalCreated, image]
              properties:
                name:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 30,
                    description: 포토카드 이름 (앞뒤 공백 제거),
                    example: 구름이,
                  }
                grade: { $ref: '#/components/schemas/Grade' }
                genre: { $ref: '#/components/schemas/Genre' }
                minPrice:
                  {
                    type: integer,
                    minimum: 0,
                    maximum: 100000,
                    description: 기준(최소) 가격,
                    example: 10,
                  }
                totalCreated:
                  {
                    type: integer,
                    minimum: 1,
                    maximum: 10,
                    description: 총 발행량,
                    example: 5,
                  }
                description:
                  {
                    type: string,
                    maxLength: 100,
                    nullable: true,
                    description: 한 줄 설명 (생략 가능),
                  }
                image:
                  {
                    type: string,
                    format: binary,
                    description: 'jpg · png · webp, 5MB 이하',
                  }
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CreatedCard' }
        '400':
          description: 필수값 누락, 범위 초과, 이미지 형식·용량 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: VALIDATION_FAILED
                  message: 입력값을 확인해 주세요.
                  fieldErrors:
                    name: [1~30자로 입력해 주세요.]
                    image:
                      ['5MB 이하의 jpg, png, webp 파일만 올릴 수 있습니다.']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 이번 달 생성 횟수(3회)를 모두 사용함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: CARD_QUOTA_EXCEEDED,
                    message: 이번 달 포토카드 생성 횟수를 모두 사용했습니다.,
                    fieldErrors: {},
                  }
        '500':
          description: 이미지 업로드 실패 또는 서버 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                IMAGE_UPLOAD_FAILED:
                  summary: 이미지 업로드 실패
                  value:
                    error:
                      {
                        code: IMAGE_UPLOAD_FAILED,
                        message: 이미지를 업로드하지 못했습니다. 다시 시도해 주세요.,
                        fieldErrors: {},
                      }
                INTERNAL_SERVER_ERROR:
                  summary: 기타 서버 오류
                  value:
                    error:
                      {
                        code: INTERNAL_SERVER_ERROR,
                        message: 서버 오류가 발생했습니다.,
                        fieldErrors: {},
                      }

  /api/cards/quota:
    get:
      tags: [Cards]
      summary: 이번 달 포토카드 생성 잔여 횟수 조회
      description: 월 기준은 한국 시간(KST) 매월 1일 00:00입니다. `remainingQuota`가 0이면 「생성 기회 소진」 화면을 보여줍니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      maxQuota:
                        {
                          type: integer,
                          description: 월간 최대 생성 횟수,
                          example: 3,
                        }
                      usedQuota:
                        {
                          type: integer,
                          description: 이번 달 생성 횟수,
                          example: 1,
                        }
                      remainingQuota:
                        { type: integer, description: 남은 횟수, example: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/cards/me:
    get:
      tags: [Cards]
      summary: 마이갤러리 포토카드 목록 조회
      description: |
        내 보유 카드 중 사용 가능 수량(netQuantity)이 남은 카드만 조회합니다.
        마켓플레이스 판매하기·교환하기 모달의 보유 카드 목록에서도 같이 사용합니다.
        `gradeCounts`는 검색·필터와 관계없이 전체 가용 카드 기준입니다.

        페이지 번호 방식 유지 (10/27 회의). 무한 스크롤로 바꾸게 되면 김수지님이 공유
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/GradeFilter'
        - $ref: '#/components/parameters/GenreFilter'
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, price_asc, price_desc]
            default: latest
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MyCard' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  gradeCounts: { $ref: '#/components/schemas/GradeCounts' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/cards/me/sales:
    get:
      tags: [Cards]
      summary: 나의 판매 포토카드 목록 조회
      description: |
        내가 등록한 판매글(취소 안 된 것)과 내가 다른 판매글에 보낸 대기 중 교환 제안을 함께 조회합니다.
        `saleType`을 지정하지 않으면 두 종류를 모두 조회합니다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/GradeFilter'
        - $ref: '#/components/parameters/GenreFilter'
        - name: saleType
          in: query
          description: 'SALE: 판매 중, EXCHANGE: 교환 제시 대기 중'
          schema: { type: string, enum: [SALE, EXCHANGE] }
        - name: isSoldOut
          in: query
          description: 'true: 매진, false: 거래 가능'
          schema: { type: boolean }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MySaleItem' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  gradeCounts: { $ref: '#/components/schemas/GradeCounts' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── Sales ─────────────────────────
  /api/sales:
    get:
      tags: [Sales]
      summary: 판매글 목록 조회
      description: |
        마켓플레이스 화면(무한 스크롤)에서 씁니다. **커서 방식**(기본 15개)이라 다음 페이지는 이전 응답의 `nextCursor`를 넘깁니다.
        로그인하지 않아도 조회할 수 있습니다.

        ⚠️ 가격순 정렬의 커서 형식(가격 + id)은 구현할 때 정함
      security:
        - {}
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 15 }
        - $ref: '#/components/parameters/Keyword'
        - name: excludeSoldOut
          in: query
          description: true면 품절 제외
          schema: { type: boolean }
        - $ref: '#/components/parameters/GenreFilter'
        - $ref: '#/components/parameters/GradeFilter'
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, oldest, price_asc, price_desc]
            default: latest
        - name: cursor
          in: query
          description: 이전 응답의 nextCursor (첫 요청엔 생략)
          schema: { type: string }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Sale' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Sales]
      summary: 판매글 올리기
      description: |
        판매자는 요청으로 받지 않고 로그인 정보로 식별합니다.
        트랜잭션: ① 본인 카드이고 netQuantity ≥ 등록 수량인지 ② price ≥ PhotoCard.minPrice ③ netQuantity 감소 ④ Sale 생성 (remainingQuantity = totalQuantity)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCardId, price, totalQuantity]
              properties:
                userCardId: { type: integer, example: 12 }
                price:
                  {
                    type: integer,
                    minimum: 0,
                    maximum: 100000,
                    description: 장당 가격 (카드 minPrice 이상),
                    example: 20000,
                  }
                totalQuantity:
                  {
                    type: integer,
                    minimum: 1,
                    maximum: 10,
                    description: 판매 등록 수량,
                    example: 3,
                  }
                exchangeGrade: { $ref: '#/components/schemas/GradeNullable' }
                exchangeGenre: { $ref: '#/components/schemas/GenreNullable' }
                exchangeDescription:
                  {
                    type: string,
                    maxLength: 200,
                    nullable: true,
                    description: 교환 희망 설명,
                    example: 다른 사진 원해요,
                  }
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }
        '400':
          description: 요청 값 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                VALIDATION_FAILED:
                  summary: 필수값 누락 · 범위 초과
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 입력값을 확인해 주세요.
                      fieldErrors:
                        { totalQuantity: [1~10장 사이로 입력해 주세요.] }
                SALE_PRICE_TOO_LOW:
                  summary: 카드의 최소 가격보다 낮음
                  value:
                    error:
                      {
                        code: SALE_PRICE_TOO_LOW,
                        message: 판매 가격은 최소 가격 이상이어야 합니다.,
                        fieldErrors: { price: [최소 10P 이상 입력해 주세요.] },
                      }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 내 카드가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: USER_CARD_FORBIDDEN,
                    message: 본인이 보유한 카드만 판매할 수 있습니다.,
                    fieldErrors: {},
                  }
        '404':
          description: 카드가 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: USER_CARD_NOT_FOUND,
                    message: 카드를 찾을 수 없습니다.,
                    fieldErrors: {},
                  }
        '409':
          description: 판매할 수 있는 수량이 부족함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: CARD_QUANTITY_NOT_ENOUGH,
                    message: 판매할 수 있는 카드 수량이 부족합니다.,
                    fieldErrors: {},
                  }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/sales/{saleId}:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    get:
      tags: [Sales]
      summary: 판매글 상세 조회
      description: |
        **로그인한 사용자만** 조회할 수 있습니다 (10/27 회의).
        구매자 화면과 판매자 화면 모두 이 API를 씁니다. `isMine`으로 어느 화면을 보여줄지 정합니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SaleNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Sales]
      summary: 판매글 수정하기
      description: |
        판매자만 수정할 수 있습니다. 바꿀 필드만 보냅니다.
        **수량 변경 허용** — 내 남은 카드(netQuantity) + 현재 남은 판매 수량까지 늘릴 수 있고, 이미 팔린 수량 아래로는 줄일 수 없습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                price:
                  { type: integer, minimum: 0, maximum: 100000, example: 25000 }
                totalQuantity:
                  {
                    type: integer,
                    minimum: 1,
                    maximum: 10,
                    description: 총 판매 수량,
                  }
                exchangeGrade: { $ref: '#/components/schemas/GradeNullable' }
                exchangeGenre: { $ref: '#/components/schemas/GenreNullable' }
                exchangeDescription:
                  { type: string, maxLength: 200, nullable: true }
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }
        '400':
          description: 요청 값 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                VALIDATION_FAILED:
                  summary: 빈 요청 · 범위 초과
                  value:
                    error:
                      {
                        code: VALIDATION_FAILED,
                        message: 입력값을 확인해 주세요.,
                        fieldErrors: {},
                      }
                SALE_PRICE_TOO_LOW:
                  summary: 최소 가격보다 낮음
                  value:
                    error:
                      {
                        code: SALE_PRICE_TOO_LOW,
                        message: 판매 가격은 최소 가격 이상이어야 합니다.,
                        fieldErrors: {},
                      }
                SALE_QUANTITY_TOO_LOW:
                  summary: 이미 팔린 수량보다 적게 줄이려 함
                  value:
                    error:
                      {
                        code: SALE_QUANTITY_TOO_LOW,
                        message: 이미 판매된 수량보다 적게 줄일 수 없습니다.,
                        fieldErrors: {},
                      }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SaleForbidden' }
        '404': { $ref: '#/components/responses/SaleNotFound' }
        '409':
          description: 지금 상태 때문에 수정 불가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                SALE_CANCELLED:
                  summary: 이미 내린 판매글
                  value:
                    error:
                      {
                        code: SALE_CANCELLED,
                        message: 판매가 취소된 글입니다.,
                        fieldErrors: {},
                      }
                SALE_SOLD_OUT:
                  summary: 품절된 판매글
                  value:
                    error:
                      {
                        code: SALE_SOLD_OUT,
                        message: 품절된 판매글은 수정할 수 없습니다.,
                        fieldErrors: {},
                      }
                CARD_QUANTITY_NOT_ENOUGH:
                  summary: 늘리려는 수량만큼 카드가 없음
                  value:
                    error:
                      {
                        code: CARD_QUANTITY_NOT_ENOUGH,
                        message: 판매할 수 있는 카드 수량이 부족합니다.,
                        fieldErrors: {},
                      }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Sales]
      summary: 판매글 내리기
      description: |
        소프트 삭제(cancelledAt 기록)입니다. 남은 수량은 판매자 netQuantity로 복구되고,
        대기 중 교환 제시는 자동 `CANCELLED` 되며 제시 카드도 복구됩니다.

        자동 취소된 제시의 제시자에게 **알림은 보내지 않습니다** (10/27 회의).
        자동 취소된 제시는 `CANCELLED`가 되어 제시자의 「나의 판매 포토카드」 목록(대기 중인 제시만 표시)에서 빠짐
      responses:
        '200':
          description: 내리기 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, example: 12 }
                      cancelledAt:
                        {
                          type: string,
                          format: date-time,
                          example: '2026-10-26T05:12:30.123Z',
                        }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SaleForbidden' }
        '404': { $ref: '#/components/responses/SaleNotFound' }
        '409':
          description: 이미 내린 판매글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: SALE_CANCELLED,
                    message: 이미 판매가 취소된 글입니다.,
                    fieldErrors: {},
                  }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/sales/{saleId}/purchases:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    post:
      tags: [Sales]
      summary: 카드 구매하기
      description: |
        구매자는 로그인 정보로 식별합니다. 한 트랜잭션에서 처리합니다.
        ① 내 글·취소 글 확인 ② 남은 수량 조건부 감소 ③ 구매자 포인트 차감 ④ 판매자 포인트 증가 ⑤ Purchase 생성
        ⑥ 판매자 카드 감소 ⑦ 구매자 카드 추가 (보유 10장 제한) ⑧ PointHistory 2건 ⑨ 알림 (판매, 남은 수량 0이면 품절)

        결제 가격은 클라이언트가 보낸 값이 아니라 **구매 시점 판매글의 가격**을 사용합니다.

        **가격 변경 방어** (10/27 회의: 구매자가 본 가격과 다르면 구매를 막는다):
        `expectedPrice`(구매자가 화면에서 본 장당 가격)를 보내면 판매글 가격과 비교해 다를 때 409 `SALE_PRICE_CHANGED`.
        ⚠️ `expectedPrice` 적용 여부는 Sales 담당 검토 후 확정

        **검사 순서** (여러 개 해당하면 먼저 걸린 에러를 보냄):
        400 요청 값 → 401 로그인 → 404 판매글 없음 → 403 내 글 → 409 취소 → 409 품절 → 409 가격 변경 → 409 남은 수량 부족 → 409 10장 초과 → 409 포인트 부족
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 10, example: 2 }
                expectedPrice:
                  type: integer
                  minimum: 0
                  maximum: 100000
                  description: '⚠️ 검토 중 — 구매자가 화면에서 본 장당 가격. 판매글 가격과 다르면 409'
                  example: 10000
      responses:
        '201':
          description: 구매 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, example: 1 }
                      saleId: { type: integer, example: 15 }
                      quantity: { type: integer, example: 2 }
                      price:
                        {
                          type: integer,
                          description: 장당 거래 가격,
                          example: 10000,
                        }
                      createdAt: { type: string, format: date-time }
                      card:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          grade: { $ref: '#/components/schemas/Grade' }
                          genre: { $ref: '#/components/schemas/Genre' }
                          imageUrl: { type: string }
        '400':
          description: 구매 수량이 없거나 1~10이 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: VALIDATION_FAILED
                  message: 입력값을 확인해 주세요.
                  fieldErrors: { quantity: [1~10장 사이로 입력해 주세요.] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 내 판매글을 구매하려 함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: PURCHASE_OWN_SALE,
                    message: 본인의 판매글은 구매할 수 없습니다.,
                    fieldErrors: {},
                  }
        '404': { $ref: '#/components/responses/SaleNotFound' }
        '409':
          description: 지금 상태 때문에 구매 불가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                SALE_CANCELLED:
                  summary: 판매가 취소된 글
                  value:
                    error:
                      {
                        code: SALE_CANCELLED,
                        message: 판매가 취소된 글입니다.,
                        fieldErrors: {},
                      }
                SALE_SOLD_OUT:
                  summary: 품절
                  value:
                    error:
                      {
                        code: SALE_SOLD_OUT,
                        message: 품절된 포토카드입니다.,
                        fieldErrors: {},
                      }
                SALE_PRICE_CHANGED:
                  summary: '⚠️ 검토 중 — 구매자가 본 가격과 현재 가격이 다름'
                  value:
                    error:
                      {
                        code: SALE_PRICE_CHANGED,
                        message: 판매 가격이 변경되었습니다. 가격을 확인한 뒤 다시 구매해 주세요.,
                        fieldErrors: {},
                      }
                SALE_QUANTITY_NOT_ENOUGH:
                  summary: 남은 수량보다 많이 구매하려 함
                  value:
                    error:
                      {
                        code: SALE_QUANTITY_NOT_ENOUGH,
                        message: 남은 수량보다 많이 구매할 수 없습니다.,
                        fieldErrors:
                          { quantity: [최대 2장까지 구매할 수 있습니다.] },
                      }
                CARD_LIMIT_EXCEEDED:
                  summary: 구매하면 같은 카드 보유가 10장을 넘음
                  value:
                    error:
                      {
                        code: CARD_LIMIT_EXCEEDED,
                        message: 같은 포토카드는 최대 10장까지 보유할 수 있습니다.,
                        fieldErrors: {},
                      }
                POINT_NOT_ENOUGH:
                  summary: 포인트 부족
                  value:
                    error:
                      {
                        code: POINT_NOT_ENOUGH,
                        message: 포인트가 부족합니다.,
                        fieldErrors: {},
                      }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── Exchanges ─────────────────────────
  /api/sales/{saleId}/exchanges:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    get:
      tags: [Exchanges]
      summary: 판매글의 교환 제시 목록
      description: |
        **보는 사람에 따라 결과가 다릅니다.**
        - 판매자 → 이 판매글에 들어온 제시 **전체** (판매자 상세 화면 하단 「교환 제시 목록」)
        - 그 외 로그인 사용자 → **내가 보낸 제시만** (구매자 상세 화면 하단 「내가 제시한 교환 목록」), 없으면 빈 배열
      parameters:
        - $ref: '#/components/parameters/ExchangeStatusFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExchangeOffer' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SaleNotFound' }
    post:
      tags: [Exchanges]
      summary: 카드 교환 제시하기
      description: |
        한 트랜잭션: ① 판매글이 취소·품절이 아닌지 ② 교환 희망 등급·장르가 있으면 제시 카드와 일치하는지 (null이면 통과)
        ③ 제시 카드 netQuantity −1 ④ ExchangeOffer 생성 (`PENDING`) ⑤ 판매자에게 알림

        제시할 수 있는 카드는 **판매 등록되지 않은 수량(netQuantity)** 안에서만 가능합니다.
        (예: 10장 중 3장을 판매 등록했으면 남은 7장으로만 제시 가능)

        같은 카드로 같은 판매글에는 **한 번만** 제시할 수 있습니다 (거절·취소 후에도 재제시 불가).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offeredUserCardId]
              properties:
                offeredUserCardId:
                  {
                    type: integer,
                    description: '내 UserCard, netQuantity 1 이상',
                    example: 9,
                  }
                description:
                  type: string
                  maxLength: 200
                  nullable: true
                  description: 교환 제시 내용 (선택)
                  example: 스페인 여행 사진도 좋은데.. 우리집 앞마당 포토카드와 교환하고 싶습니다!
      responses:
        '201':
          description: 제시 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, example: 3 }
                      status: { $ref: '#/components/schemas/ExchangeStatus' }
                      saleId: { type: integer, example: 1 }
                      offeredCard:
                        type: object
                        properties:
                          id: { type: integer, example: 9 }
                          name: { type: string, example: 스페인 여행 }
                          grade: { $ref: '#/components/schemas/Grade' }
                      createdAt: { type: string, format: date-time }
        '400':
          description: 요청 값 오류 또는 교환 희망 조건 불일치
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                VALIDATION_FAILED:
                  summary: 카드 미선택 · 설명 200자 초과
                  value:
                    error:
                      {
                        code: VALIDATION_FAILED,
                        message: 입력값을 확인해 주세요.,
                        fieldErrors: {},
                      }
                EXCHANGE_CONDITION_MISMATCH:
                  summary: 교환 희망 등급·장르와 다른 카드
                  value:
                    error:
                      {
                        code: EXCHANGE_CONDITION_MISMATCH,
                        message: 판매자가 원하는 등급·장르의 카드가 아닙니다.,
                        fieldErrors: {},
                      }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 권한 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                EXCHANGE_OWN_SALE:
                  summary: 본인 판매글에 제시
                  value:
                    error:
                      {
                        code: EXCHANGE_OWN_SALE,
                        message: 본인의 판매글에는 교환을 제시할 수 없습니다.,
                        fieldErrors: {},
                      }
                USER_CARD_FORBIDDEN:
                  summary: 내 카드가 아님
                  value:
                    error:
                      {
                        code: USER_CARD_FORBIDDEN,
                        message: 본인이 보유한 카드만 제시할 수 있습니다.,
                        fieldErrors: {},
                      }
        '404':
          description: 판매글 또는 제시할 카드가 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                SALE_NOT_FOUND:
                  summary: 판매글 없음
                  value:
                    error:
                      {
                        code: SALE_NOT_FOUND,
                        message: 판매글을 찾을 수 없습니다.,
                        fieldErrors: {},
                      }
                USER_CARD_NOT_FOUND:
                  summary: 제시할 카드 없음
                  value:
                    error:
                      {
                        code: USER_CARD_NOT_FOUND,
                        message: 카드를 찾을 수 없습니다.,
                        fieldErrors: {},
                      }
        '409':
          description: 지금 상태 때문에 제시 불가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                SALE_CANCELLED:
                  summary: 취소된 판매글
                  value:
                    error:
                      {
                        code: SALE_CANCELLED,
                        message: 판매가 취소된 글입니다.,
                        fieldErrors: {},
                      }
                SALE_SOLD_OUT:
                  summary: 품절된 판매글
                  value:
                    error:
                      {
                        code: SALE_SOLD_OUT,
                        message: 품절된 포토카드입니다.,
                        fieldErrors: {},
                      }
                CARD_QUANTITY_NOT_ENOUGH:
                  summary: 제시할 카드 수량 부족
                  value:
                    error:
                      {
                        code: CARD_QUANTITY_NOT_ENOUGH,
                        message: 제시할 수 있는 카드 수량이 부족합니다.,
                        fieldErrors: {},
                      }
                EXCHANGE_DUPLICATED:
                  summary: 같은 카드로 이미 제시함
                  value:
                    error:
                      {
                        code: EXCHANGE_DUPLICATED,
                        message: 이 카드로 이미 교환을 제시했습니다.,
                        fieldErrors: {},
                      }

  /api/exchanges/me:
    get:
      tags: [Exchanges]
      summary: 나에게 들어온 교환 제시 전체
      description: |
        내 판매글들에 들어온 제시를 한 번에 조회합니다. 디자인에 쓰는 화면은 없고, **만들어 두고 필요하면 사용**하기로 했습니다.
        서버에서 `/api/exchanges/{exchangeId}`보다 **먼저** 라우터를 등록해야 합니다.
      parameters:
        - $ref: '#/components/parameters/ExchangeStatusFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ExchangeOffer'
                        - type: object
                          properties:
                            sale:
                              type: object
                              properties:
                                id: { type: integer, example: 1 }
                                photoCard:
                                  type: object
                                  properties:
                                    id: { type: integer, example: 1 }
                                    name:
                                      { type: string, example: 우리집 앞마당 }
                                    grade:
                                      { $ref: '#/components/schemas/Grade' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/exchanges/{exchangeId}:
    parameters:
      - name: exchangeId
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Exchanges]
      summary: 교환 승인 / 거절 / 취소
      description: |
        - `APPROVED`(승인) · `REJECTED`(거절): 판매자만
        - `CANCELLED`(취소): 제시자만 — 구매자 화면 「교환 제시 취소하기」 모달

        **알림** (10/27 회의): 승인·거절되면 **제시자에게 알림**. 제시자가 취소할 때 판매자에게는 알림 없음 (필요하면 나중에 추가).
        거절·취소되면 제시 카드는 제시자의 netQuantity로 복구됩니다.

        **수량 처리** (10/27 회의: 교환과 판매 수량은 별개):
        승인하면 판매자가 주는 카드는 **판매 등록하지 않은 카드(netQuantity)에서 1장** 빠집니다. 판매글의 남은 수량(`remainingQuantity`)은 바뀌지 않습니다.
        예: 10장 보유 중 3장을 판매 등록했으면, 교환으로 줄 수 있는 건 남은 7장. netQuantity가 0이면 승인할 수 없습니다 (409).

        승인 트랜잭션: ① `PENDING` 조건부 업데이트 ② 판매자 netQuantity −1 ③ 제시자에게 판매글 카드 +1 ④ 판매자에게 제시 카드 +1 ⑤ 제시자에게 알림

        동시 요청을 막기 위해 `status = PENDING` 조건부 업데이트로 처리하고, 바뀐 행이 없으면 409입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED, CANCELLED]
                  example: APPROVED
      responses:
        '200':
          description: 처리 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, example: 3 }
                      status: { $ref: '#/components/schemas/ExchangeStatus' }
                      saleId: { type: integer, example: 1 }
        '400':
          description: APPROVED / REJECTED / CANCELLED 외의 값
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: VALIDATION_FAILED,
                    message: 입력값을 확인해 주세요.,
                    fieldErrors:
                      {
                        status:
                          ['APPROVED, REJECTED, CANCELLED 중 하나여야 합니다.'],
                      },
                  }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 판매자가 아닌데 승인·거절, 또는 제시자가 아닌데 취소
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: EXCHANGE_FORBIDDEN,
                    message: 이 교환 제시를 처리할 권한이 없습니다.,
                    fieldErrors: {},
                  }
        '404':
          description: 교환 제시 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: EXCHANGE_NOT_FOUND,
                    message: 교환 제시를 찾을 수 없습니다.,
                    fieldErrors: {},
                  }
        '409':
          description: 지금 상태 때문에 처리 불가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                EXCHANGE_NOT_PENDING:
                  summary: 이미 처리된 제시 (동시 요청 포함)
                  value:
                    error:
                      {
                        code: EXCHANGE_NOT_PENDING,
                        message: 이미 처리된 교환 제시입니다.,
                        fieldErrors: {},
                      }
                CARD_QUANTITY_NOT_ENOUGH:
                  summary: 판매자에게 판매 등록 안 된 카드가 남아 있지 않음
                  value:
                    error:
                      {
                        code: CARD_QUANTITY_NOT_ENOUGH,
                        message: 교환할 수 있는 카드 수량이 부족합니다.,
                        fieldErrors: {},
                      }
                SALE_CANCELLED:
                  summary: 승인 시점에 판매 취소됨
                  value:
                    error:
                      {
                        code: SALE_CANCELLED,
                        message: 판매가 취소된 글입니다.,
                        fieldErrors: {},
                      }
                CARD_LIMIT_EXCEEDED:
                  summary: 받는 쪽 보유 10장 초과
                  value:
                    error:
                      {
                        code: CARD_LIMIT_EXCEEDED,
                        message: 같은 포토카드는 최대 10장까지 보유할 수 있습니다.,
                        fieldErrors: {},
                      }

# ───────────────────────── 공통 부품 ─────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: 로그인하면 자동으로 설정되는 httpOnly 쿠키 (15분)
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: 토큰 재발급용 httpOnly 쿠키 (7일)

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
    Keyword:
      name: keyword
      in: query
      description: 포토카드 이름 검색어 (설명은 검색하지 않음)
      schema: { type: string, maxLength: 50 }
    GradeFilter:
      name: grade
      in: query
      schema: { $ref: '#/components/schemas/Grade' }
    GenreFilter:
      name: genre
      in: query
      schema: { $ref: '#/components/schemas/Genre' }
    SaleId:
      name: saleId
      in: path
      required: true
      schema: { type: integer }
    ExchangeStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [PENDING, APPROVED, REJECTED, CANCELLED]
        default: PENDING

  responses:
    ValidationFailed:
      description: 요청 값 오류 (어느 칸이 틀렸는지는 fieldErrors)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              {
                code: VALIDATION_FAILED,
                message: 입력값을 확인해 주세요.,
                fieldErrors: {},
              }
    Unauthorized:
      description: 로그인하지 않음 또는 토큰 만료
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              {
                code: UNAUTHENTICATED,
                message: 로그인이 필요합니다.,
                fieldErrors: {},
              }
    SaleForbidden:
      description: 판매자가 아님
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              {
                code: SALE_FORBIDDEN,
                message: 판매자만 할 수 있습니다.,
                fieldErrors: {},
              }
    SaleNotFound:
      description: 판매글이 없거나 (조회 시) 취소된 글
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              {
                code: SALE_NOT_FOUND,
                message: 판매글을 찾을 수 없습니다.,
                fieldErrors: {},
              }
    ServerError:
      description: 서버 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              {
                code: INTERNAL_SERVER_ERROR,
                message: 서버 오류가 발생했습니다.,
                fieldErrors: {},
              }

  schemas:
    ErrorResponse:
      type: object
      description: 팀 공통 에러 형식
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: UNAUTHENTICATED }
            message: { type: string, example: 로그인이 필요합니다. }
            fieldErrors:
              type: object
              description: '필드별 에러 문구 목록 (예: { "email": ["이미 사용 중인 이메일입니다."] })'
              additionalProperties:
                type: array
                items: { type: string }

    Pagination:
      type: object
      description: 페이지 번호 방식 (마이갤러리, 나의 판매, 알림, 교환 목록)
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 12 }
        totalCount: { type: integer, example: 11 }
        totalPages: { type: integer, example: 1 }
        hasNext: { type: boolean, example: false }

    CursorPagination:
      type: object
      description: 커서 방식 (마켓플레이스 무한 스크롤 전용, 기본 15개)
      properties:
        limit: { type: integer, example: 15 }
        totalCount: { type: integer, example: 100 }
        hasNext: { type: boolean, example: true }
        nextCursor: { type: string, nullable: true, example: '16' }

    Grade:
      type: string
      description: 포토카드 등급. 화면에는 밑줄 없이 표시 (예 SUPER_RARE → SUPER RARE)
      enum: [COMMON, RARE, SUPER_RARE, LEGENDARY]
    GradeNullable:
      type: string
      nullable: true
      description: 교환 희망 등급 (없으면 null)
      enum: [COMMON, RARE, SUPER_RARE, LEGENDARY]
    Genre:
      type: string
      enum:
        [
          ALBUM,
          SPECIAL,
          FAN_SIGN,
          SEASONS_GREETINGS,
          FAN_MEETING,
          CONCERT,
          MD,
          COLLAB,
          FAN_CLUB,
          OTHERS,
        ]
    GenreNullable:
      type: string
      nullable: true
      description: 교환 희망 장르 (없으면 null)
      enum:
        [
          ALBUM,
          SPECIAL,
          FAN_SIGN,
          SEASONS_GREETINGS,
          FAN_MEETING,
          CONCERT,
          MD,
          COLLAB,
          FAN_CLUB,
          OTHERS,
        ]
    ExchangeStatus:
      type: string
      description: 'PENDING 대기 · APPROVED 승인 · REJECTED 거절 · CANCELLED 취소'
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]

    GradeCounts:
      type: object
      description: 등급별 합계 (상단 배너용)
      properties:
        COMMON: { type: integer, example: 5 }
        RARE: { type: integer, example: 3 }
        SUPER_RARE: { type: integer, example: 2 }
        LEGENDARY: { type: integer, example: 1 }

    AuthUser:
      type: object
      properties:
        id: { type: integer, example: 1 }
        email: { type: string, example: user1@example.com }
        nickname: { type: string, example: 최애덕후 }
        point: { type: integer, description: 가입 시 0, example: 1000 }

    Notification:
      type: object
      properties:
        id: { type: integer, description: 알림 번호 }
        message: { type: string, description: 화면에 표시할 문구 }
        saleId:
          {
            type: integer,
            nullable: true,
            description: 이동할 판매글 번호 (없으면 null),
          }
        createdAt: { type: string, format: date-time }
        readAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: null이면 안 읽음,
          }

    CreatedCard:
      type: object
      properties:
        userCardId: { type: integer, example: 15 }
        photoCardId: { type: integer, example: 8 }
        name: { type: string, example: 구름이 }
        grade: { $ref: '#/components/schemas/Grade' }
        genre: { $ref: '#/components/schemas/Genre' }
        minPrice: { type: integer, example: 10 }
        totalCreated: { type: integer, example: 5 }
        netQuantity:
          { type: integer, description: 사용 가능 보유 수량, example: 5 }
        totalQuantity: { type: integer, description: 총 보유 수량, example: 5 }
        imageUrl:
          { type: string, example: 'https://res.cloudinary.com/.../sample.jpg' }
        description:
          { type: string, nullable: true, example: 구름이 사진 포카입니다. }
        creatorNickname: { type: string, example: cloud }
        createdAt: { type: string, format: date-time }

    MyCard:
      type: object
      description: 마이갤러리 카드
      properties:
        userCardId: { type: integer, example: 15 }
        photoCardId: { type: integer, example: 8 }
        name: { type: string, example: 우리집 강아지 구름이 }
        grade: { $ref: '#/components/schemas/Grade' }
        genre: { $ref: '#/components/schemas/Genre' }
        minPrice: { type: integer, example: 10 }
        netQuantity:
          {
            type: integer,
            description: 판매·교환에 묶이지 않은 사용 가능 수량,
            example: 3,
          }
        totalQuantity:
          {
            type: integer,
            description: 판매·교환 등록분 포함 총 보유 수량,
            example: 5,
          }
        imageUrl: { type: string }
        creatorNickname: { type: string, example: cloud }
        updatedAt:
          { type: string, format: date-time, description: 최근 획득·갱신 시각 }

    MySaleItem:
      type: object
      description: 나의 판매 목록 항목 (판매글 또는 보낸 교환 제안)
      properties:
        id:
          {
            type: string,
            description: 'sale-{id} 또는 exchange-{id}',
            example: sale-12,
          }
        saleType: { type: string, enum: [SALE, EXCHANGE] }
        saleId: { type: integer, description: 연결된 판매글 ID, example: 12 }
        exchangeOfferId:
          { type: integer, nullable: true, description: SALE 항목이면 null }
        isSoldOut: { type: boolean }
        photoCardId: { type: integer, example: 7 }
        name: { type: string, example: 구름 }
        grade: { $ref: '#/components/schemas/Grade' }
        genre: { $ref: '#/components/schemas/Genre' }
        price: { type: integer, description: 판매글의 장당 가격, example: 1500 }
        quantity:
          {
            type: integer,
            description: 'SALE: 남은 판매 수량 / EXCHANGE: 1',
            example: 2,
          }
        totalQuantity:
          {
            type: integer,
            description: 'SALE: 최초 등록 수량 / EXCHANGE: 1',
            example: 5,
          }
        imageUrl: { type: string }
        creatorNickname: { type: string, example: cloud }
        createdAt: { type: string, format: date-time }

    Sale:
      type: object
      description: |
        판매글. 취소된 판매글은 목록·상세에 나오지 않으므로, 응답에 오는 판매글은 판매 중 또는 품절입니다.
        품절 = remainingQuantity 0 (`isSoldOut: true`)
        ⚠️ 마이갤러리 카드(MyCard)와 카드 정보 모양이 다름 — 통일 여부 확인
      properties:
        id: { type: integer, example: 1 }
        price: { type: integer, example: 10000 }
        totalQuantity: { type: integer, example: 3 }
        remainingQuantity: { type: integer, example: 2 }
        isSoldOut:
          {
            type: boolean,
            description: remainingQuantity가 0이면 true,
            example: false,
          }
        exchangeGrade: { $ref: '#/components/schemas/GradeNullable' }
        exchangeGenre: { $ref: '#/components/schemas/GenreNullable' }
        exchangeDescription: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        seller:
          type: object
          properties:
            id: { type: integer, example: 7 }
            nickname: { type: string, example: 몬스테라 }
        isMine:
          {
            type: boolean,
            description: 로그인한 사용자의 판매글인지 (판매자 화면 / 구매자 화면 구분),
          }
        card:
          type: object
          properties:
            id: { type: integer, example: 1 }
            name: { type: string, example: 몬스테라 사진 }
            grade: { $ref: '#/components/schemas/Grade' }
            genre: { $ref: '#/components/schemas/Genre' }
            description:
              { type: string, example: 멋진 몬스테라 사진을 찍었습니다. }
            imageUrl: { type: string }
            creator:
              type: object
              properties:
                id: { type: integer, example: 10 }
                nickname: { type: string, example: 발행자 닉네임 }

    ExchangeOffer:
      type: object
      properties:
        id: { type: integer, example: 3 }
        status: { $ref: '#/components/schemas/ExchangeStatus' }
        description:
          {
            type: string,
            nullable: true,
            example: 스페인 여행 사진도 좋은데.. 우리집 앞마당 포토카드와 교환하고 싶습니다!,
          }
        createdAt: { type: string, format: date-time }
        proposer:
          type: object
          properties:
            id: { type: integer, example: 2 }
            nickname: { type: string, example: 프로여행러 }
        offeredCard:
          type: object
          properties:
            id: { type: integer, example: 9 }
            name: { type: string, example: 스페인 여행 }
            grade: { $ref: '#/components/schemas/Grade' }
            genre: { $ref: '#/components/schemas/Genre' }
            imageUrl: { type: string }
            price: { type: integer, example: 4 }
